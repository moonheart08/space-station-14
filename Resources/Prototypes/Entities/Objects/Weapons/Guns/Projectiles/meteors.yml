- type: entity
  id: MeteorLarge
  name: meteor
  noSpawn: true
  components:
  - type: Sprite
    noRot: false
    netsync: false
    sprite: Objects/Weapons/Guns/Projectiles/meteor.rsi
    scale: 4,4
    layers:
    - state: large
      shader: unshaded
  - type: ExplodeOnTrigger
  - type: DeleteOnTrigger
  - type: TriggerOnCollide
    minimumTriggerMass: 10
  - type: Projectile
    damage: {}
    deleteOnCollide: false
    timeLeft: 60
  - type: Explosive
    explosionType: Default
    totalIntensity: 600.0
    intensitySlope: 30
    maxIntensity: 45
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
    linearDamping: 0
  - type: Fixtures
    fixtures:
    - shape:
        !type:PhysShapeCircle
          radius: 0.4
      mass: 200
      hard: true
      layer:
        - MapGrid
      mask:
        - Impassable

- type: entity
  id: MeteorCollosalChunk
  parent: MeteorLarge
  name: meteor
  noSpawn: true
  components:
    - type: Explosive
      explosionType: Default
      totalIntensity: 1200.0
      intensitySlope: 10
      maxIntensity: 50

- type: entity
  id: MeteorColossal
  name: Colossal Meteor Parent (You shouldn't see this!)
  noSpawn: true
  components:
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures: []
  - type: Aggregate
    radius: 4
    minimumDistance: 1.2
    randomizeRotation: true
    parts:
    - id: MeteorCollosalChunk
