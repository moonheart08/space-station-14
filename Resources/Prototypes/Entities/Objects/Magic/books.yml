- type: entity
  id: BaseSpellbook
  name: spellbook
  parent: BaseItem
  abstract: true
  components:
    - type: Sprite
      netsync: false
      sprite: Objects/Misc/books.rsi
      layers:
        - state: book_demonomicon
    - type: Spellbook

- type: entity
  id: SpawnSpellbook
  name: spawn spellbook
  parent: BaseSpellbook
  components:
    - type: Spellbook
      instantSpells:
        FlashRune: -1
      worldSpells:
        SpawnMagicarpSpell: -1

- type: entity
  id: ForceWallSpellbook
  name: force wall spellbook
  parent: BaseSpellbook
  components:
    - type: Sprite
      netsync: false
      sprite: Objects/Magic/spellbooks.rsi
      layers:
        - state: bookforcewall
    - type: Spellbook
      instantSpells:
        ForceWall: -1

- type: entity
  id: BlinkBook
  name: blink spellbook
  parent: BaseSpellbook
  components:
    - type: Sprite
      netsync: false
      sprite: Objects/Magic/spellbooks.rsi
      layers:
        - state: spellbook
    - type: Spellbook
      worldSpells:
        Blink: -1

- type: entity
  id: KnockSpellbook
  name: knock spellbook
  parent: BaseSpellbook
  components:
    - type: Sprite
      netsync: false
      sprite: Objects/Magic/spellbooks.rsi
      layers:
        - state: bookknock
    - type: Spellbook
      instantSpells:
        Knock: -1

- type: entity
  id: GorillamorphSpellbook
  name: gorillamorph spellbook
  description: Oh wow, it's just like the hit bookseries Animorphs.
  parent: BaseSpellbook
  components:
    - type: Spellbook
      instantSpells:
        BecomeGorilla: -1

- type: entity
  id: PropClosetSpellbook
  name: propcloset spellbook
  description: This book makes you feel like it's 2012 again.
  parent: BaseSpellbook
  components:
    - type: Spellbook
      instantSpells:
        BecomeLocker: -1
